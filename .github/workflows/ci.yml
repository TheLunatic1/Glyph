name: CI (Windows, macOS, Linux)

on:
  push:
    branches: [main, v3-rust]
  pull_request:
    branches: [main, v3-rust]

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  check-and-test:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust stable toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Cache Cargo artifacts
        uses: Swatinem/rust-cache@v2

      - name: Install Linux GUI & system dependencies
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libx11-dev \
            libxkbcommon-dev \
            libwayland-dev \
            libgtk-3-dev \
            libxdo-dev \
            libasound2-dev \
            libdbus-1-dev \
            libxcursor-dev \
            libxi-dev \
            libxinerama-dev \
            libxrandr-dev \
            libvulkan-dev \
            pkg-config

      - name: Verify zero OpenSSL / aws-lc-sys / cmake build dependencies
        shell: bash
        run: |
          if cargo tree | grep -qi "aws-lc"; then
            echo "ERROR: Forbidden aws-lc dependency detected"
            exit 1
          fi

      - name: Clippy (-D warnings)
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Test full workspace (Core, SSH/SFTP, VNC, REST API, MCP, Desktop)
        run: cargo test --workspace
