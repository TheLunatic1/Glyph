name: Release Glyph

# Triggers:
#   1. Auto — on push to main/v3-rust touching Cargo.toml (reads workspace version, tags if new, builds + publishes)
#   2. Manual — workflow_dispatch with optional custom tag override
on:
  push:
    branches: [main, v3-rust]
    paths:
      - 'Cargo.toml'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to release (e.g. v3.0.0) — leave empty to use version in Cargo.toml'
        required: false
        type: string

env:
  CARGO_TERM_COLOR: always

jobs:
  prepare:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.resolve.outputs.tag }}
      version: ${{ steps.pkg.outputs.version }}
      should_build: ${{ steps.decide.outputs.should_build }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Read workspace version from Cargo.toml
        id: pkg
        run: |
          VER=$(grep -m1 '^version = ' Cargo.toml | sed 's/.*"\(.*\)".*/\1/')
          echo "version=$VER" >> "$GITHUB_OUTPUT"

      - name: Resolve target tag
        id: resolve
        run: |
          if [ -n "${{ github.event.inputs.tag }}" ]; then
            echo "tag=${{ github.event.inputs.tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=v${{ steps.pkg.outputs.version }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Check tag and decide whether to build
        id: decide
        run: |
          TAG="${{ steps.resolve.outputs.tag }}"
          if git rev-parse "$TAG" >/dev/null 2>&1; then
            echo "Tag $TAG already exists."
            if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
              echo "should_build=true" >> "$GITHUB_OUTPUT"
            else
              echo "should_build=false" >> "$GITHUB_OUTPUT"
            fi
          else
            echo "Creating release tag $TAG"
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git tag "$TAG"
            git push origin "$TAG"
            echo "should_build=true" >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: prepare
    if: needs.prepare.outputs.should_build == 'true'
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.os == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Cache Cargo artifacts
        uses: Swatinem/rust-cache@v2

      - name: Install Linux GUI dependencies
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libx11-dev \
            libxkbcommon-dev \
            libwayland-dev \
            libgtk-3-dev \
            libxdo-dev \
            libasound2-dev \
            libdbus-1-dev \
            libxcursor-dev \
            libxi-dev \
            libxinerama-dev \
            libxrandr-dev \
            libvulkan-dev \
            pkg-config \
            fuse \
            wget

      - name: Build Windows Release Binaries
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          $tag = "${{ needs.prepare.outputs.tag }}"
          cargo build --workspace --release
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          New-Item -ItemType Directory -Force -Path dist/stage | Out-Null
          Copy-Item target/release/glyph-desktop.exe "dist/Glyph-$tag-windows-x64.exe"
          Copy-Item target/release/glyph-desktop.exe dist/stage/Glyph.exe
          Copy-Item target/release/glyph-mcp.exe dist/stage/glyph-mcp.exe
          Compress-Archive -Path dist/stage/* -DestinationPath "dist/Glyph-$tag-windows-x64.zip" -Force

      - name: Build & Package macOS Universal (.app + .dmg + .zip)
        if: matrix.os == 'macos-latest'
        run: |
          TAG="${{ needs.prepare.outputs.tag }}"
          VER="${{ needs.prepare.outputs.version }}"
          cargo build --workspace --release --target aarch64-apple-darwin
          cargo build --workspace --release --target x86_64-apple-darwin

          mkdir -p "dist/Glyph.app/Contents/MacOS" "dist/Glyph.app/Contents/Resources"
          lipo -create \
            target/aarch64-apple-darwin/release/glyph-desktop \
            target/x86_64-apple-darwin/release/glyph-desktop \
            -output "dist/Glyph.app/Contents/MacOS/Glyph"
          lipo -create \
            target/aarch64-apple-darwin/release/glyph-mcp \
            target/x86_64-apple-darwin/release/glyph-mcp \
            -output "dist/Glyph.app/Contents/MacOS/glyph-mcp"
          chmod +x "dist/Glyph.app/Contents/MacOS/Glyph" "dist/Glyph.app/Contents/MacOS/glyph-mcp"
          cp assets/logo.png "dist/Glyph.app/Contents/Resources/logo.png"

          printf '%s\n' \
            '<?xml version="1.0" encoding="UTF-8"?>' \
            '<!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">' \
            '<plist version="1.0">' \
            '<dict>' \
            '  <key>CFBundleDisplayName</key><string>Glyph</string>' \
            '  <key>CFBundleExecutable</key><string>Glyph</string>' \
            '  <key>CFBundleIdentifier</key><string>com.glyph.app</string>' \
            '  <key>CFBundleName</key><string>Glyph</string>' \
            '  <key>CFBundlePackageType</key><string>APPL</string>' \
            "  <key>CFBundleShortVersionString</key><string>${VER}</string>" \
            "  <key>CFBundleVersion</key><string>${VER}</string>" \
            '  <key>NSHighResolutionCapable</key><true/>' \
            '</dict>' \
            '</plist>' > "dist/Glyph.app/Contents/Info.plist"

          ditto -c -k --keepParent "dist/Glyph.app" "dist/Glyph-$TAG-macos-universal.zip"
          hdiutil create -volname "Glyph" -srcfolder "dist/Glyph.app" -ov -format UDZO "dist/Glyph-$TAG-macos-universal.dmg"

      - name: Build & Package Linux (.tar.gz + .AppImage)
        if: matrix.os == 'ubuntu-latest'
        run: |
          TAG="${{ needs.prepare.outputs.tag }}"
          cargo build --workspace --release
          mkdir -p dist/tarball dist/AppDir/usr/bin
          cp target/release/glyph-desktop target/release/glyph-mcp assets/logo.png dist/tarball/
          tar -czf "dist/Glyph-$TAG-linux-x64.tar.gz" -C dist/tarball .

          cp target/release/glyph-desktop dist/AppDir/usr/bin/glyph-desktop
          cp target/release/glyph-mcp dist/AppDir/usr/bin/glyph-mcp
          cp assets/logo.png dist/AppDir/glyph.png
          printf '%s\n' \
            '[Desktop Entry]' \
            'Type=Application' \
            'Name=Glyph' \
            'Exec=glyph-desktop' \
            'Icon=glyph' \
            'Categories=Utility;Development;Network;' \
            'Terminal=false' > dist/AppDir/glyph.desktop

          printf '%s\n' \
            '#!/bin/sh' \
            'HERE="$(dirname "$(readlink -f "$0")")"' \
            'exec "$HERE/usr/bin/glyph-desktop" "$@"' > dist/AppDir/AppRun
          chmod +x dist/AppDir/AppRun

          wget -q https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage -O dist/appimagetool
          chmod +x dist/appimagetool
          ARCH=x86_64 APPIMAGE_EXTRACT_AND_RUN=1 ./dist/appimagetool dist/AppDir "dist/Glyph-$TAG-linux-x64.AppImage"

      - name: Publish to GitHub Releases (Windows)
        if: matrix.os == 'windows-latest'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.prepare.outputs.tag }}
          generate_release_notes: true
          files: |
            dist/*.exe
            dist/*.zip

      - name: Publish to GitHub Releases (macOS)
        if: matrix.os == 'macos-latest'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.prepare.outputs.tag }}
          generate_release_notes: true
          files: |
            dist/*.dmg
            dist/*.zip

      - name: Publish to GitHub Releases (Linux)
        if: matrix.os == 'ubuntu-latest'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.prepare.outputs.tag }}
          generate_release_notes: true
          files: |
            dist/*.tar.gz
            dist/*.AppImage
