name: Security Guard

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  malware-guard:
    name: Security Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Scan Files for Malware Signatures
        run: |
          set -e
          echo "Scanning repository for dropper signatures..."
          
          # 1. Check for specific dropper & C2 keywords / variables / addresses
          if grep -rnEI --exclude-dir={.git,node_modules,dist,build,target,.next,out,.github,vendor} "(0xa322E5f3D311D3080e6f0121063e9aDC2490Ef1a|global\.i\s*=\s*['\"]A11|ygdhqkpCgKxflnUACX|y\$zxQ\$V|_\$jsoToArr|withRpcEndpoints|candidateBlocks|lastSenderTx|decodeAddress|BLOCK_MULTIPLE|NONCE_FANOUT|GSkqNNyuJw|WlysIxGuPMcViepbraDjp|zS\$wdno|jRPe_\$pro)" . ; then
            echo "::error::Malicious signature found in repository!"
            exit 1
          fi

          # 2. Check for hidden payloads behind massive whitespace / tabs
          if grep -rnEI --exclude-dir={.git,node_modules,dist,build,target,.next,out,.github,vendor} "( {50,}|\t{10,})" . | grep -E "(require|eval|spawn|import|function|global)"; then
            echo "::error::Suspicious hidden code with whitespace padding detected!"
            exit 1
          fi

          echo "âœ… Security check passed. Codebase is clean."