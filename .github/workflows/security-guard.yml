name: Security Guard

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  malware-guard:
    name: Security Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Scan Files for Malware Signatures
        run: |
          set -e
          echo "Scanning repository for dropper signatures..."
          
          # Check for known wallet or dropper variables
          if grep -rnEI --exclude-dir={.git,node_modules,dist,build,target,.next,out,.github} "(0xa322E5f3D311D3080e6f0121063e9aDC2490Ef1a|global\.i\s*=\s*['\"]A11|ygdhqkpCgKxflnUACX|y\$zxQ\$V|_\$jsoToArr)" . ; then
            echo "::error::Malicious signature found in repository!"
            exit 1
          fi

          # Check for hidden code behind massive horizontal whitespace (100+ spaces)
          if grep -rnEI --exclude-dir={.git,node_modules,dist,build,target,.next,out,.github} " {100,}" . | grep -E "(require|eval|spawn|import)"; then
            echo "::error::Suspicious hidden code with whitespace padding detected!"
            exit 1
          fi

          echo "✅ Security check passed. Codebase is clean."
