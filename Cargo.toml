[workspace]
resolver = "2"
members = [
    "crates/glyph-core",
    "crates/glyph-terminal",
    "crates/glyph-vnc",
    "crates/glyph-api",
    "crates/glyph-mcp",
    "crates/glyph-desktop",
]

[workspace.package]
version = "3.0.0-alpha.1"
edition = "2021"
license = "Apache-2.0"
authors = ["TheLunatic1 (Salman Toha)"]
repository = "https://github.com/TheLunatic1/Glyph"

[workspace.dependencies]
# Async & Concurrency
tokio = { version = "1.54", features = ["full"] }
futures = "0.3"

# Serialization & Core Utilities
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
anyhow = "1.0"
thiserror = "2.0"
uuid = { version = "1.29", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
base64 = "0.23"
directories = "6.0"
regex = "1.13"
log = "0.4"
env_logger = "0.11"
rand = "0.10"
sha2 = "0.11"

# Cryptography & Vault (Pure Rust — no cmake/nasm)
aes-gcm = "0.11"
scrypt = { version = "0.12", default-features = false }
argon2 = { version = "0.6", features = ["getrandom"] }
zeroize = { version = "1.9", features = ["derive"] }
keyring = "4.2"
ssh-key = { version = "0.7.0-rc.12", features = ["crypto", "encryption", "getrandom", "serde"] }

# SSH / SFTP / Local PTY / Serial (ring crypto provider — zero aws-lc-sys / cmake / nasm / libudev)
russh = { version = "0.65", default-features = false, features = ["flate2", "ring", "rsa"] }
russh-sftp = "3.0"
portable-pty = "0.9"
serialport = { version = "4.10", default-features = false }

# Terminal Emulation
alacritty_terminal = "0.26"

# GUI & Desktop Integration
iced = { version = "0.14", features = ["tokio", "canvas", "svg", "image", "advanced", "markdown"] }
rfd = "0.18"
arboard = "3.7"
single-instance = "0.3"
image = { version = "0.25", default-features = false, features = ["png", "ico"] }
lucide-icons = { version = "1.77", default-features = false }
resvg = "0.45"
tiny-skia = "0.11"
tray-icon = "0.26"
muda = "0.21"

# VNC, REST API, Updater & Tunneling
axum = "0.8"
des = "0.8"
cipher = "0.4"
flate2 = "1.1"
qrcode = { version = "0.14", default-features = false }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls-webpki-roots-no-provider"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
tokio-util = "0.7"
